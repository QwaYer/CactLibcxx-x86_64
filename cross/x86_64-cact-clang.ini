# Meson cross file for CactOS userspace (x86_64, freestanding).
#
#   meson setup build-meson --cross-file cross/x86_64-cact-clang.ini
#
# The C++ runtime links against CactLibc/ld.so rather than a host libc, so clang
# only needs 64-bit mode; system = 'none' keeps Meson from assuming a hosted C
# library.  cpp is clang++ — libc++ is C++ and no other port in the workspace
# has needed a C++ compiler before this one.

[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'ar'
strip = 'strip'
objcopy = 'objcopy'

[built-in options]
c_args = ['-m64']
cpp_args = ['-m64']

[host_machine]
system = 'none'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
